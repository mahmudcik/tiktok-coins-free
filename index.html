<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok Coins Calculator — DEMO</title>
<style>
*{
  box-sizing:border-box;
}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#111;
}
.phone{
  max-width:430px;
  min-height:100vh;
  margin:auto;
  background:#fff;
  padding:25px 18px;
}
.demo{
  text-align:center;
  background:#f1f1f1;
  color:#555;
  padding:7px;
  border-radius:10px;
  font-size:12px;
  font-weight:800;
  margin-bottom:18px;
}
.tiktokHeader{
  text-align:center;
  margin-bottom:28px;
}
.tiktokIcon{
  width:58px;
  height:58px;
  margin:auto;
  border-radius:50%;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:32px;
  font-weight:900;
}
.title{
  font-size:23px;
  font-weight:800;
  margin-top:12px;
}
.subtitle{
  color:#777;
  font-size:14px;
  margin-top:5px;
}
.balanceBox{
  text-align:center;
  padding:20px;
  border-radius:18px;
  background:#f7f7f7;
  margin-bottom:22px;
}
.label{
  color:#777;
  font-size:14px;
}
.balance{
  font-size:32px;
  font-weight:800;
  margin-top:8px;
}
label{
  display:block;
  font-weight:700;
  margin:15px 0 8px;
}
.input{
  width:100%;
  padding:15px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:17px;
  outline:none;
}
.input:focus{
  border-color:#ed174c;
}
.card{
  margin-top:20px;
  padding:18px;
  border:1px solid #ddd;
  border-radius:18px;
}
.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.muted{
  color:#777;
  font-size:14px;
}
.result{
  font-size:27px;
  font-weight:800;
  margin-top:10px;
}
.coin{
  display:inline-flex;
  width:29px;
  height:29px;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:linear-gradient(145deg,#ffe89a,#f3b72f);
  border:2px solid #d99a18;
  color:#9a6410;
  font-weight:900;
  font-size:14px;
  vertical-align:middle;
}
.info{
  margin-top:18px;
  padding:14px;
  border-radius:12px;
  background:#fafafa;
  color:#666;
  font-size:13px;
  line-height:1.5;
  text-align:center;
}
button{
  width:100%;
  border:0;
  border-radius:14px;
  background:#ed174c;
  color:#fff;
  font-size:18px;
  font-weight:800;
  padding:16px;
  margin-top:18px;
}
.note{
  text-align:center;
  color:#888;
  font-size:12px;
  margin-top:20px;
}
</style>
</head>
<body>
<div class="phone">
  <div class="demo">
    DEMO / CALCULATOR
  </div>
  <div class="tiktokHeader">
    <div class="tiktokIcon">♪</div>
    <div class="title">
      TikTok Live Coins
    </div>
    <div class="subtitle">
      Coins Calculator
    </div>
  </div>
  <div class="balanceBox">
    <div class="label">
      Demo Dollar Balance
    </div>
    <div class="balance">
      $3,638,383,379
    </div>
  </div>
  <label>
    TikTok username
  </label>
  <input
    id="username"
    class="input"
    type="text"
    placeholder="@username"
  >
  <div class="card">
    <div class="muted">
      Number of Coins
    </div>
    <input
      id="amount"
      class="input"
      type="number"
      min="0"
      value="1"
      placeholder="Coin sayını yaz"
      style="margin-top:12px"
    >
    <div class="row" style="margin-top:20px">
      <span class="muted">
        Coins
      </span>
      <span class="result">
        <span class="coin">T</span>
        <span id="coins">1</span>
      </span>
    </div>
    <div class="row" style="margin-top:18px">
      <span class="muted">
        Hesablanmış məbləğ
      </span>
      <span class="result">
        $<span id="money">0.01</span>
      </span>
    </div>
    <button onclick="calculate()">
      Hesabla
    </button>
    <div id="resultBox" class="info">
      Coin sayını daxil et və nəticəni hesabla.
    </div>
  </div>
  <div class="note">
    DEMO ONLY — bu kalkulyator real TikTok Coins
    göndərmir və real pul köçürmür.
  </div>
</div>
<script>
const amount = document.getElementById("amount");
const coins = document.getElementById("coins");
const money = document.getElementById("money");
const resultBox = document.getElementById("resultBox");
function calculate(){
  let n = Number(amount.value) || 0;
  if(n < 0){
    n = 0;
  }
  coins.textContent =
    n.toLocaleString("en-US");
  /*
    DEMO hesablaması:
    100 coin = $1
  */
  let dollar = n / 100;
  money.textContent =
    dollar.toLocaleString("en-US", {
      minimumFractionDigits:2,
      maximumFractionDigits:2
    });
  if(n > 0){
    resultBox.innerHTML =
      "<strong>" +
      n.toLocaleString("en-US") +
      " Coins</strong><br>" +
      "Demo hesablaması: $" +
      dollar.toLocaleString("en-US", {
        minimumFractionDigits:2,
        maximumFractionDigits:2
      });
  }else{
    resultBox.textContent =
      "Coin sayını daxil et.";
  }
}
amount.addEventListener("input", calculate);
calculate();
</script>
</body>
</html>
